<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
</head>

<body class="flex flex-col justify-center items-center min-h-screen bg-gray-900 text-white">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-lg text-center w-[90%] md:w-[400px]">

        <!-- Title  -->
        <h1 class="text-2xl font-bold mb-4">🎯 Number Guessing Game</h1>
        <p class="mb-2 text-sm text-gray-300">Guess a number between 1 and 10</p>

        <input type="number" id="guessInput" placeholder="Enter number"
            class="text-white px-3 py-2 rounded-lg w-full mb-4 text-center">

        <button id="checkBtn" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg">Check</button>

        <p id="message" class="mt-4 text-lg font-semibold"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
