<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>

    <!-- Header  -->
  <header class="bg-gray-800 shadow-md p-6 text-center">
    <h1 class="text-3xl font-bold text-indigo-400">🎬 Movie Search App</h1>
    <p class="text-gray-400 mt-2">Find your favorite movies instantly!</p>
  </header>

  <!-- Search Section Start -->
  <section class="p-6 flex justify-center gap-4 flex-wrap bg-gray-850">
    <input id="searchInput" type="text" placeholder="Enter movie name..."
      class="w-72 p-2 rounded-lg text-black focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <button id="searchBtn"
      class="bg-indigo-500 hover:bg-indigo-600 transition px-5 py-2 rounded-lg font-semibold">Search</button>
  </section>

  <!-- Movie Container start -->
  <main id="movieContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6 flex-1">
    <!-- Movies will appear here -->
  </main>

  <!-- Movie Details Modal -->
  <div id="movieModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center">
    <div class="bg-gray-800 rounded-2xl shadow-xl p-6 w-96 relative">
      <button id="closeModal" class="absolute top-2 right-3 text-gray-400 hover:text-white text-xl">✖</button>
      <img id="modalPoster" src="" alt="Poster" class="w-full rounded-lg mb-4">
      <h2 id="modalTitle" class="text-2xl font-bold text-indigo-400 mb-2"></h2>
      <p id="modalYear" class="text-gray-400 mb-1"></p>
      <p id="modalGenre" class="text-gray-400 mb-1"></p>
      <p id="modalPlot" class="text-gray-300 text-sm"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
